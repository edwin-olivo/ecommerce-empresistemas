# Docker Compose para Ecommerce MVC
version: '3.8'

services:
  web:
    build: .
    container_name: ecommerce-mvc-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/apache/vhost.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      - APP_ENV=docker
      - APP_DEBUG=true
      - APP_URL=http://localhost:8080
    restart: unless-stopped
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
